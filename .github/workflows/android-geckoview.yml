name: Android GeckoView Prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "android-geckoview/**"
      - ".github/workflows/android-geckoview.yml"
  pull_request:
    paths:
      - "android-geckoview/**"
      - ".github/workflows/android-geckoview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-geckoview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autoewt-geckoview-debug-apk
          path: android-geckoview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
